<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print → Tierlist</title>
<style>
  :root { color-scheme: dark; --bg:#0f1115; --panel:#1a1d26; --edge:#2a2f3d; --txt:#e8ebf2; --muted:#8a92a6; --accent:#5b8dff; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--txt); }
  nav { display:flex; gap:4px; padding:10px 18px; border-bottom:1px solid var(--edge); align-items:center; }
  nav .logo { font-weight:700; margin-right:16px; }
  nav a { color:var(--muted); text-decoration:none; padding:6px 12px; border-radius:6px; }
  nav a.active, nav a:hover { color:var(--txt); background:var(--panel); }
  nav .spacer { flex:1; }
  main { padding:20px; max-width:1200px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 16px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin:0 0 10px; }
  button, .btn { background:var(--panel); color:var(--txt); border:1px solid var(--edge); border-radius:6px; padding:8px 14px; cursor:pointer; font:inherit; text-decoration:none; display:inline-block; }
  button:hover, .btn:hover { border-color:#4a5168; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:#ff8080; }
  input[type=text], input[type=number], select { background:var(--panel); color:var(--txt); border:1px solid var(--edge); border-radius:6px; padding:8px 10px; font:inherit; }
  .panel { background:var(--panel); border:1px solid var(--edge); border-radius:10px; padding:16px; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
  .card { background:var(--panel); border:1px solid var(--edge); border-radius:10px; padding:12px; cursor:pointer; transition:border-color .1s; }
  .card:hover { border-color:#4a5168; }
  .card .thumb { width:100%; aspect-ratio:4/3; background:#0a0c12; border-radius:6px; overflow:hidden; display:flex; align-items:center; justify-content:center; margin-bottom:8px; position:relative; }
  .card .thumb img { width:100%; height:100%; object-fit:cover; }
  .card .cover { position:absolute; bottom:6px; right:6px; display:none; padding:4px 8px; font-size:11px; background:rgba(0,0,0,.55); color:#fff; border:0; border-radius:4px; cursor:pointer; }
  .card:hover .cover { display:inline-block; }
  .card .ttl { font-weight:600; font-size:13px; }
  .card .meta { color:var(--muted); font-size:11px; margin-top:4px; }
  .setTags { display:flex; flex-wrap:wrap; gap:4px; }
  .setTags:not(:empty) { margin-top:8px; }
  .setTag { max-width:100%; overflow-wrap:anywhere; padding:2px 8px; border:1px solid var(--edge); border-radius:14px; color:var(--muted); font-size:12px; }
  .empty { color:var(--muted); text-align:center; padding:40px; border:1px dashed var(--edge); border-radius:10px; }
  #drop { border:2px dashed var(--edge); border-radius:10px; padding:60px 20px; text-align:center; color:var(--muted); cursor:pointer; }
  #drop.hover { border-color:var(--accent); color:var(--txt); }
  #preview { margin-top:16px; position:relative; width:fit-content; max-width:100%; }
  #preview img { max-width:100%; display:block; border-radius:6px; }
  #preview.cropping img { cursor:crosshair; touch-action:none; }
  #overlay { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

  /* editor */
  .setHeader { margin-bottom:16px; }
  .setBack { display:inline-block; margin-bottom:12px; color:var(--muted); text-decoration:none; }
  .setBack:hover { color:var(--txt); }
  .setHeaderRow, .setFilters, .tierHeader { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; }
  .setHeaderRow h1 { flex:1 1 220px; min-width:0; margin:0; overflow-wrap:anywhere; }
  .setActions, .tierActions { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
  .setExportActions { display:flex; flex-wrap:wrap; gap:8px; }
  .setFilters, .moveToolbar { padding:12px 16px; }
  .setSearch { flex:1 1 230px; }
  .setSearch input { flex:1; min-width:0; }
  .setFilters select { max-width:180px; }
  .moveActions { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
  .moveActions select { max-width:160px; }
  .tierHeader { margin-bottom:12px; }
  .tierHeader h2 { margin:0; }
  .tierTemplateMenu { position:relative; }
  .tierTemplateMenu summary { list-style:none; }
  .tierTemplateMenu summary::-webkit-details-marker { display:none; }
  .tierTemplateMenu summary::after { content:'▾'; margin-left:8px; }
  .tierTemplateOptions { position:absolute; top:calc(100% + 4px); right:0; z-index:4; min-width:max-content; padding:4px; background:var(--panel); border:1px solid var(--edge); border-radius:6px; box-shadow:0 4px 12px rgba(0,0,0,.3); }
  .tierTemplateOptions button { display:block; width:100%; text-align:left; border-color:transparent; }
  .moveToolbar button:disabled, .tierActions button:disabled { opacity:.5; cursor:default; border-color:var(--edge); }
  .editor { display:grid; grid-template-columns:300px minmax(0, 1fr); gap:16px; }
  @media (max-width: 900px) { .editor { grid-template-columns:minmax(0, 1fr); } }
  #pool { display:flex; flex-wrap:wrap; gap:6px; min-height:92px; padding:8px; border:1px dashed var(--edge); border-radius:8px; }
  .cell { width:60px; height:80px; border-radius:14px; background-size:cover; background-position:center; cursor:grab; box-shadow:0 1px 3px rgba(0,0,0,.5); }
  .cell.drag { opacity:.4; }
  #pool button.cell { padding:0; cursor:pointer; }
  .cell[aria-pressed="true"] { box-shadow:inset 0 0 0 3px #ffd84d; }
  .cell:focus-visible { outline:2px solid var(--txt); outline-offset:2px; }
  .editor .cell { padding:0; }
  dialog { background:var(--panel); color:var(--txt); border:1px solid var(--edge); border-radius:10px; }
  dialog::backdrop { background:rgba(0,0,0,.65); }
  .exportPreview { overflow:auto; }
  .exportPreview img { display:block; max-width:100%; height:auto; margin:0 auto; }
  .exportPreview.actualSize img { max-width:none; }
  .tier { display:grid; grid-template-columns: 56px 1fr; border:1px solid var(--edge); border-radius:8px; margin-bottom:8px; }
  .tier .lblWrap { position:relative; border-radius:7px 0 0 7px; }
  .tier .drop { border-radius:0 7px 7px 0; }
  .tier .lbl { height:100%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:22px; color:#111; outline:none; padding:0 4px; text-align:center; word-break:break-word; }
  .tier .tools { position:absolute; top:3px; right:3px; display:none; gap:3px; z-index:2; }
  .tier .lblWrap:hover .tools, .tier .lblWrap.open .tools { display:flex; }
  .tier .tools button { width:18px; height:18px; padding:0; border:0; border-radius:4px; background:rgba(0,0,0,.45); color:#fff; font-size:11px; line-height:18px; text-align:center; cursor:pointer; }
  .tier .tools .colorBtn { display:inline-block; }
  .palette { position:absolute; top:24px; right:3px; display:none; grid-template-columns:repeat(8,16px); gap:3px; padding:6px; background:#1a1d26; border:1px solid var(--edge); border-radius:6px; z-index:3; }
  .tier .lblWrap.open .palette { display:grid; }
  .palette span { width:16px; height:16px; border-radius:3px; cursor:pointer; border:1px solid rgba(255,255,255,.1); }
  .palette span:hover { outline:2px solid #fff; }
  #tiers.wide .tier { grid-template-columns: 90px 1fr; }
  #tiers.wide .tier .lbl { font-size: var(--tier-font, 18px); letter-spacing:.02em; line-height:1.05; }
  .tier .drop { min-height:92px; padding:8px; display:flex; flex-wrap:wrap; gap:6px; background:#141822; }
  .tier .drop.over { background:#1c2232; }
  .row { display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
  label { color:var(--muted); font-size:12px; display:inline-flex; align-items:center; gap:6px; }
  label[hidden] { display:none; }
</style>
</head>
<body>

<nav>
  <span class="logo">🧃 P2T</span>
  <a href="#/sets" data-route="/sets">Sets</a>
  <a href="#/upload" data-route="/upload">Novo</a>
  <a href="#/exports" data-route="/exports">Exports</a>
</nav>

<main id="view"></main>

<script>
// ---------- storage ----------
const DB = {
  sets: () => JSON.parse(localStorage.getItem('sets') || '[]'),
  saveSets: v => localStorage.setItem('sets', JSON.stringify(v)),
  exports: () => JSON.parse(localStorage.getItem('exports') || '[]'),
  saveExports: v => localStorage.setItem('exports', JSON.stringify(v)),
  tierTemplates: () => JSON.parse(localStorage.getItem('tierTemplates') || '[]'),
  saveTierTemplates: v => localStorage.setItem('tierTemplates', JSON.stringify(v)),
  getSet: id => DB.sets().find(s => s.id === id),
  upsertSet: s => { const a = DB.sets(); const i = a.findIndex(x => x.id === s.id); if (i<0) a.unshift(s); else a[i] = s; DB.saveSets(a); },
  delSet: id => DB.saveSets(DB.sets().filter(s => s.id !== id)),
  delExport: id => DB.saveExports(DB.exports().filter(e => e.id !== id)),
};
const uid = () => Math.random().toString(36).slice(2,10);
const fmtDate = ts => new Date(ts).toLocaleString('pt-BR', { dateStyle:'short', timeStyle:'short' });
const searchKey = value => value.normalize('NFD').replace(/\p{M}/gu, '').toLocaleLowerCase('pt-BR').trim();

function parseSetTags(value) {
  const tags = new Map();
  for (const part of value.split(',')) {
    const tag = part.trim();
    const key = searchKey(tag);
    if (key && !tags.has(key)) tags.set(key, tag);
  }
  return [...tags.values()];
}

function showSetTags(container, tags = []) {
  container.replaceChildren();
  for (const tag of tags) {
    const badge = document.createElement('span');
    badge.className = 'setTag';
    badge.textContent = tag;
    container.appendChild(badge);
  }
}

// ---------- router ----------
const view = document.getElementById('view');
const routes = {};
function route(path, fn) { routes[path] = fn; }
function matchRoute(hash) {
  const h = hash.replace(/^#/, '') || '/sets';
  for (const p in routes) {
    const parts = p.split('/'), got = h.split('/');
    if (parts.length !== got.length) continue;
    const params = {};
    let ok = true;
    for (let i=0; i<parts.length; i++) {
      if (parts[i].startsWith(':')) params[parts[i].slice(1)] = decodeURIComponent(got[i]);
      else if (parts[i] !== got[i]) { ok = false; break; }
    }
    if (ok) return { fn: routes[p], params };
  }
  return null;
}
function render() {
  const m = matchRoute(location.hash) || { fn: routes['/sets'], params:{} };
  view.innerHTML = '';
  m.fn(m.params);
  for (const a of document.querySelectorAll('nav a')) {
    a.classList.toggle('active', location.hash.startsWith('#'+a.dataset.route));
  }
}
window.addEventListener('hashchange', render);

// ---------- views ----------
route('/sets', () => {
  const sets = DB.sets();
  const h = document.createElement('div');
  h.innerHTML = `<div class="row"><h1 style="flex:1">Sets</h1><a class="btn primary" href="#/upload">+ Novo set</a></div>`;
  view.appendChild(h);
  if (!sets.length) {
    view.insertAdjacentHTML('beforeend', `<div class="empty">Nenhum set ainda. Clique em "Novo set" pra enviar um print.</div>`);
    return;
  }
  view.insertAdjacentHTML('beforeend', `
    <div class="panel setFilters">
      <label class="setSearch">Buscar sets <input id="setSearch" type="text" placeholder="Nome ou tag"></label>
      <label>Tag <select id="setTagFilter"><option value="">Todas as tags</option></select></label>
    </div>`);
  const search = document.getElementById('setSearch');
  const tagFilter = document.getElementById('setTagFilter');
  const tags = new Map();
  const entries = [];
  const g = document.createElement('div'); g.className = 'grid';
  for (const s of sets) {
    const idx = s.coverIndex ?? 0;
    const c = document.createElement('div'); c.className = 'card';
    c.innerHTML = `
      <div class="thumb">
        ${s.cards[idx] ? `<img src="${s.cards[idx]}">` : ''}
        <button class="cover" data-cover="${s.id}" title="Trocar capa">↻ capa</button>
      </div>
      <div class="ttl"></div>
      <div class="meta">${s.cards.length} skins · ${fmtDate(s.createdAt)}</div>
      <div class="setTags"></div>
      <div class="row" style="margin-top:8px"><a class="btn" data-open href="#/set/${encodeURIComponent(s.id)}">Abrir</a><button class="danger" data-del="${s.id}">Excluir</button></div>`;
    c.querySelector('.ttl').textContent = s.name;
    showSetTags(c.querySelector('.setTags'), s.tags);
    const tagKeys = new Set();
    for (const tag of s.tags || []) {
      const key = searchKey(tag);
      if (!tags.has(key)) tags.set(key, tag);
      tagKeys.add(key);
    }
    entries.push({ card: c, tagKeys, text: searchKey([s.name, ...(s.tags || [])].join(' ')) });
    g.appendChild(c);
  }
  view.appendChild(g);
  for (const [key, tag] of [...tags].sort((a, b) => a[1].localeCompare(b[1], 'pt-BR'))) {
    tagFilter.add(new Option(tag, key));
  }
  const noMatches = document.createElement('p');
  noMatches.className = 'empty';
  noMatches.textContent = 'Nenhum set corresponde à busca.';
  noMatches.setAttribute('role', 'status');
  noMatches.hidden = true;
  view.appendChild(noMatches);
  function filterSets() {
    const terms = searchKey(search.value).split(/\s+/);
    const tag = tagFilter.value;
    let anyMatch = false;
    for (const { card, tagKeys, text } of entries) {
      card.hidden = (tag !== '' && !tagKeys.has(tag)) || !terms.every(term => text.includes(term));
      if (!card.hidden) anyMatch = true;
    }
    noMatches.hidden = anyMatch;
  }
  search.oninput = filterSets;
  tagFilter.onchange = filterSets;
  g.addEventListener('click', e => {
    const delId = e.target.dataset.del;
    if (delId && confirm('Excluir esse set?')) { DB.delSet(delId); render(); return; }
    const coverId = e.target.dataset.cover;
    if (coverId) {
      e.stopPropagation();
      const s = DB.getSet(coverId);
      if (!s || !s.cards.length) return;
      s.coverIndex = ((s.coverIndex ?? 0) + 1) % s.cards.length;
      DB.upsertSet(s);
      const img = e.target.parentElement.querySelector('img');
      if (img) img.src = s.cards[s.coverIndex];
    }
    if (!e.target.closest('a, button')) {
      const open = e.target.closest('.card')?.querySelector('[data-open]');
      if (open) location.hash = open.hash;
    }
  });
});

route('/upload', () => renderUpload());
route('/set/:id/upload', ({ id }) => {
  const set = DB.getSet(id);
  if (set) renderUpload(set);
  else view.textContent = 'Set não encontrado.';
});

function renderUpload(targetSet) {
  view.innerHTML = `
    <h1>${targetSet ? 'Adicionar prints ao set' : 'Novo set'}</h1>
    ${targetSet ? `<a class="btn" href="#/set/${targetSet.id}" style="margin-bottom:10px">← Voltar ao set</a>` : ''}
    <div class="panel">
      <button id="drop" type="button" style="width:100%">Clique ou arraste os prints aqui</button>
      <input id="file" type="file" accept="image/*" multiple hidden>
      <p id="uploadStatus" role="status" hidden></p>
      <div id="printControls" class="row" style="display:none; margin-top:10px">
        <label>Print <select id="prints"></select></label>
        <button id="cropPrint" type="button" aria-pressed="false">Recortar print</button>
        <button id="resetCrop" type="button" hidden>Usar print inteiro</button>
        <button id="removePrint" type="button">Remover print</button>
      </div>
      <p id="cropHint" hidden>Arraste sobre o print para selecionar a área do inventário.</p>
      <div id="preview"><canvas id="overlay"></canvas></div>
    </div>
    <div class="panel" id="controls" style="display:none">
      <div class="row">
        ${targetSet ? '' : '<label>Nome <input type="text" id="setName" placeholder="Meu inventário"></label>'}
        ${targetSet ? '' : '<label>Tags do set <input type="text" id="newSetTags" placeholder="Separe por vírgulas"></label>'}
        ${targetSet ? '' : '<label id="templateLabel" hidden>Modelo de tiers <select id="tierTemplate"><option value="">Padrão</option></select></label>'}
        <label>cols <input type="number" id="cols" min="1" max="20" style="width:70px"></label>
        <label>rows <input type="number" id="rows" min="1" max="20" style="width:70px"></label>
        <label>recorte % <input type="number" id="pad" min="0" max="40" value="8" style="width:70px"></label>
        <button id="refatiar">Refatiar</button>
        <button id="autobtn">Auto</button>
        <span style="flex:1"></span>
        <button class="primary" id="save">${targetSet ? 'Adicionar cards →' : 'Salvar set →'}</button>
      </div>
      <div class="row">
        <span>Selecione os cards que deseja remover do set.</span>
        <button id="removeCards" type="button" class="danger" disabled>Remover selecionados</button>
        <button id="undoRemoveCards" type="button" disabled>Desfazer remoção</button>
      </div>
      <div id="pool"></div>
    </div>`;
  initUpload(targetSet);
}

route('/set/:id', ({ id }) => {
  const set = DB.getSet(id);
  if (!set) { view.innerHTML = `<p>Set não encontrado. <a href="#/sets">voltar</a></p>`; return; }
  view.innerHTML = `
    <header class="setHeader">
      <a class="setBack" href="#/sets">← Sets</a>
      <div class="setHeaderRow">
        <h1 id="setTitle" contenteditable spellcheck="false"></h1>
        <div class="setActions">
          <button id="editSetTags" type="button">Editar tags</button>
          <a class="btn" href="#/set/${set.id}/upload">Adicionar prints</a>
          <div class="setExportActions" role="group" aria-label="Exportação">
            <button id="sheetBtn" type="button">Baixar preview do set</button>
            <button class="primary" id="exportBtn" type="button">Exportar PNG</button>
          </div>
        </div>
      </div>
      <div class="setTags" id="setTags"></div>
    </header>
    <div class="panel moveToolbar moveActions" role="group" aria-label="Mover cards">
      <label>Mover para <select id="moveDestination"></select></label>
      <button id="moveCards" type="button" disabled>Mover selecionados</button>
    </div>
    <div class="editor">
      <div class="panel"><h2>Pool</h2><div id="pool"></div></div>
      <div class="panel">
        <div class="tierHeader">
          <h2>Tiers</h2>
          <div class="tierActions">
            <button id="addTier" type="button">+ Adicionar tier</button>
            <details class="tierTemplateMenu" id="tierTemplateMenu">
              <summary class="btn">Modelos</summary>
              <div class="tierTemplateOptions">
                <button id="loadTierTemplate" type="button">Carregar modelo</button>
                <button id="saveTierTemplate" type="button">Salvar como modelo</button>
              </div>
            </details>
          </div>
        </div>
        <div id="tiers"></div>
      </div>
    </div>
    <dialog id="setTagDialog" aria-labelledby="setTagHeading">
      <form method="dialog">
        <h2 id="setTagHeading">Tags do set</h2>
        <div class="row"><label>Tags <input id="setTagsInput" type="text" placeholder="Separe por vírgulas"></label></div>
        <div class="row"><button value="save" class="primary">Salvar</button><button value="cancel">Cancelar</button></div>
        <p id="setTagsError" role="status" hidden></p>
      </form>
    </dialog>
    <dialog id="templateDetails">
      <form method="dialog">
        <div class="row"><label>Nome do modelo <input id="templateName" type="text"></label></div>
        <div class="row"><button value="save" class="primary">Salvar</button><button value="cancel">Cancelar</button></div>
        <p id="templateError" role="status" hidden></p>
      </form>
    </dialog>
    <dialog id="loadTemplateDialog" aria-labelledby="loadTemplateHeading">
      <form method="dialog">
        <h2 id="loadTemplateHeading">Carregar modelo</h2>
        <div class="row"><label>Modelo <select id="savedTierTemplates"></select></label></div>
        <p id="loadTemplateHint"></p>
        <p id="loadTemplateError" role="status" hidden></p>
        <div class="row">
          <button id="applyTierTemplate" value="apply" class="primary">Aplicar modelo</button>
          <button value="cancel">Cancelar</button>
        </div>
      </form>
    </dialog>`;
  const title = document.getElementById('setTitle');
  title.textContent = set.name;
  const saveName = () => {
    const n = title.textContent.trim();
    if (n && n !== set.name) { set.name = n; DB.upsertSet(set); }
    else title.textContent = set.name;
  };
  title.addEventListener('blur', saveName);
  title.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); title.blur(); } });
  const tags = document.getElementById('setTags');
  const tagDialog = document.getElementById('setTagDialog');
  const tagsInput = document.getElementById('setTagsInput');
  const tagsError = document.getElementById('setTagsError');
  showSetTags(tags, set.tags);
  document.getElementById('editSetTags').onclick = () => {
    tagsInput.value = (set.tags || []).join(', ');
    tagsError.hidden = true;
    tagDialog.showModal();
  };
  tagDialog.querySelector('form').onsubmit = event => {
    if (event.submitter?.value === 'cancel') return;
    event.preventDefault();
    const updatedTags = parseSetTags(tagsInput.value);
    try {
      DB.upsertSet({ ...set, tags: updatedTags });
    } catch (error) {
      if (error.name !== 'QuotaExceededError') throw error;
      tagsError.textContent = 'Armazenamento cheio. Libere espaço para salvar as tags.';
      tagsError.hidden = false;
      return;
    }
    set.tags = updatedTags;
    showSetTags(tags, set.tags);
    tagDialog.close();
  };
  initEditor(set);
});

route('/exports', () => {
  const exps = DB.exports();
  view.innerHTML = `<h1>Exports</h1>`;
  if (!exps.length) { view.insertAdjacentHTML('beforeend', `<div class="empty">Nada exportado ainda.</div>`); return; }
  const g = document.createElement('div'); g.className = 'grid';
  for (const e of exps) {
    const c = document.createElement('div'); c.className = 'card';
    c.innerHTML = `
      <a class="thumb" href="#/exports/${encodeURIComponent(e.id)}"><img alt=""></a>
      <div class="ttl" contenteditable spellcheck="false" data-id="${e.id}"></div>
      <div class="meta">${fmtDate(e.createdAt)}</div>
      <div class="row" style="margin-top:8px"><a class="btn" data-dl="${e.id}">Baixar</a><button class="danger" data-del="${e.id}">Excluir</button></div>`;
    const thumb = c.querySelector('.thumb');
    thumb.setAttribute('aria-label', 'Visualizar ' + e.name);
    thumb.querySelector('img').src = e.png;
    c.querySelector('.ttl').textContent = e.name;
    c.querySelector('[data-dl]').href = e.png;

    };

  }
  view.appendChild(g);
  g.addEventListener('click', e => {
    const id = e.target.dataset.del;
    if (id && confirm('Excluir?')) { DB.delExport(id); render(); }
  });
  g.addEventListener('blur', e => {
    const id = e.target.dataset?.id; if (!id) return;
    const n = e.target.textContent.trim(); if (!n) return;
    const all = DB.exports();
    const x = all.find(x => x.id === id); if (!x || x.name === n) return;
    x.name = n; DB.saveExports(all);
    // refresh the matching download link with the new filename
    const dl = e.target.parentElement.querySelector('[data-dl]');
    if (dl) dl.download = n + '.png';
    e.target.parentElement.querySelector('.thumb').setAttribute('aria-label', 'Visualizar ' + n);
  }, true);
  g.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.dataset?.id) { e.preventDefault(); e.target.blur(); }
  });
});

// ---------- upload logic ----------
function initUpload(targetSet) {
  const drop = document.getElementById('drop');
  const fileInput = document.getElementById('file');
  const preview = document.getElementById('preview');
  const overlay = document.getElementById('overlay');
  const controls = document.getElementById('controls');
  const pool = document.getElementById('pool');
  const prints = document.getElementById('prints');
  const printControls = document.getElementById('printControls');
  const cropPrint = document.getElementById('cropPrint');
  const resetCrop = document.getElementById('resetCrop');
  const cropHint = document.getElementById('cropHint');
  const status = document.getElementById('uploadStatus');
  const setName = document.getElementById('setName');
  const colsInput = document.getElementById('cols');
  const rowsInput = document.getElementById('rows');
  const padInput = document.getElementById('pad');
  const save = document.getElementById('save');
  const removeCards = document.getElementById('removeCards');
  const undoRemoveCards = document.getElementById('undoRemoveCards');
  const tierTemplate = document.getElementById('tierTemplate');
  const templates = tierTemplate ? DB.tierTemplates() : [];
  for (const template of templates) tierTemplate.add(new Option(template.name, template.id));
  if (templates.length) document.getElementById('templateLabel').hidden = false;
  const screenshots = [];
  const lastRemoval = new Map();
  let pending = Promise.resolve();
  let pendingBatches = 0;
  let cropping = false;
  let drag = null;

  const selected = () => screenshots[prints.selectedIndex];

  drop.onclick = () => fileInput.click();
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('hover'); };
  drop.ondragleave = () => drop.classList.remove('hover');
  drop.ondrop = e => {
    e.preventDefault();
    drop.classList.remove('hover');
    addFiles(e.dataTransfer.files);
  };
  fileInput.onchange = () => {
    addFiles(fileInput.files);
    fileInput.value = '';
  };

  function showStatus(message) {
    status.textContent = message;
    status.hidden = !message;
  }

  function addFiles(fileList) {
    const files = Array.from(fileList);
    if (!files.length) return;
    pendingBatches++;
    save.disabled = true;
    showStatus('Carregando prints…');
    pending = pending.then(async () => {
      const failed = [];
      for (const file of files) {
        if (!drop.isConnected) break;
        const url = URL.createObjectURL(file);
        try {
          const img = new Image();
          img.src = url;
          await img.decode();
          if (!drop.isConnected) break;
          const screenshot = { img };
          autoSlice(screenshot);
          screenshots.push(screenshot);
          const first = prints.options.length === 0;
          prints.add(new Option(file.name));
          if (first && setName && !setName.value) setName.value = file.name.replace(/\.[^.]+$/, '');
        } catch {
          failed.push(file.name);
        } finally {
          URL.revokeObjectURL(url);
        }
      }
      pendingBatches--;
      if (!drop.isConnected) return;
      showStatus(pendingBatches ? 'Carregando prints…' :
        failed.length ? 'Não foi possível carregar: ' + failed.join(', ') : '');
      if (preview.querySelector('img') !== selected()?.img) showPrint();
      renderPool();
    });
  }

  prints.onchange = showPrint;
  document.getElementById('removePrint').onclick = () => {
    const index = prints.selectedIndex;
    lastRemoval.delete(selected());
    screenshots.splice(index, 1);
    prints.remove(index);
    prints.selectedIndex = Math.min(index, screenshots.length - 1);
    showPrint();
    renderPool();
  };

  function showPrint() {
    const screenshot = selected();
    controls.style.display = screenshot ? '' : 'none';
    printControls.style.display = screenshot ? '' : 'none';
    preview.querySelector('img')?.remove();
    overlay.width = 0;
    overlay.height = 0;
    if (!screenshot) {
      setCropMode(false);
      return;
    }
    const { img, grid, pad } = screenshot;
    img.alt = prints.options[prints.selectedIndex].text;
    img.draggable = false;
    preview.insertBefore(img, overlay);
    colsInput.value = grid.cols;
    rowsInput.value = grid.rows;
    padInput.value = pad;
    setCropMode(false);
  }

  function setCropMode(active) {
    cropping = active;
    drag = null;
    preview.classList.toggle('cropping', active);
    cropPrint.setAttribute('aria-pressed', active);
    cropPrint.textContent = active ? 'Cancelar recorte' : 'Recortar print';
    cropHint.hidden = !active;
    resetCrop.hidden = !selected()?.crop;
    drawOverlay();
  }

  cropPrint.onclick = () => setCropMode(!cropping);
  resetCrop.onclick = () => applyCrop(undefined);

  function applyCrop(crop) {
    const screenshot = selected();
    screenshot.crop = crop;
    autoSlice(screenshot);
    showPrint();
    renderPool();
    cropPrint.focus();
  }

  function cropPoint(event) {
    const img = selected().img;
    const rect = img.getBoundingClientRect();
    const x = Math.max(0, Math.min(1, (event.clientX - rect.left) / rect.width));
    const y = Math.max(0, Math.min(1, (event.clientY - rect.top) / rect.height));
    return { x: Math.round(x * img.naturalWidth), y: Math.round(y * img.naturalHeight) };
  }

  function cropRect(start, end) {
    return {
      x: Math.min(start.x, end.x), y: Math.min(start.y, end.y),
      w: Math.abs(start.x - end.x), h: Math.abs(start.y - end.y),
    };
  }

  preview.onpointerdown = event => {
    if (!cropping || drag || event.button !== 0 || event.target !== selected()?.img) return;
    event.preventDefault();
    preview.setPointerCapture(event.pointerId);
    const point = cropPoint(event);
    drag = { pointerId: event.pointerId, start: point, end: point };
    drawOverlay();
  };
  preview.onpointermove = event => {
    if (drag?.pointerId !== event.pointerId) return;
    drag.end = cropPoint(event);
    drawOverlay();
  };
  preview.onpointerup = event => {
    if (drag?.pointerId !== event.pointerId) return;
    const crop = cropRect(drag.start, cropPoint(event));
    drag = null;
    if (crop.w >= 4 && crop.h >= 4) applyCrop(crop);
    else drawOverlay();
  };
  preview.onlostpointercapture = event => {
    if (drag?.pointerId !== event.pointerId) return;
    drag = null;
    drawOverlay();
  };

  function renderPool() {
    pool.innerHTML = '';
    let cardNumber = 0;
    for (const screenshot of screenshots) {
      screenshot.cards.forEach((src, index) => {
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'cell';
        card.style.backgroundImage = `url(${src})`;
        card.setAttribute('aria-label', 'Card ' + ++cardNumber);
        card.setAttribute('aria-pressed', screenshot.selectedCards.has(index));
        card.onclick = () => {
          const pressed = !screenshot.selectedCards.delete(index);
          if (pressed) screenshot.selectedCards.add(index);
          card.setAttribute('aria-pressed', pressed);
          updateRemoveCards();
        };
        pool.appendChild(card);
      });
    }
    save.disabled = pendingBatches > 0 || cardNumber === 0;
    updateRemoveCards();
  }

  function updateRemoveCards() {
    const count = screenshots.reduce((total, screenshot) => total + screenshot.selectedCards.size, 0);
    removeCards.disabled = count === 0;
    removeCards.textContent = count ? `Remover selecionados (${count})` : 'Remover selecionados';
    undoRemoveCards.disabled = lastRemoval.size === 0;
  }

  removeCards.onclick = () => {
    lastRemoval.clear();
    for (const screenshot of screenshots) {
      if (!screenshot.selectedCards.size) continue;
      lastRemoval.set(screenshot, screenshot.cards);
      screenshot.cards = screenshot.cards.filter((_, index) => !screenshot.selectedCards.has(index));
      screenshot.selectedCards.clear();
    }
    renderPool();
    undoRemoveCards.focus();
  };

  undoRemoveCards.onclick = () => {
    for (const [screenshot, cards] of lastRemoval) {
      screenshot.cards = cards;
      screenshot.selectedCards.clear();
    }
    lastRemoval.clear();
    renderPool();
    (pool.firstElementChild || drop).focus();
  };

  function sliceByGrid(screenshot, grid, pad, automatic) {
    const { img } = screenshot;
    const { cols, rows, gridLinesX, gridLinesY } = grid;
    const cards = [];
    for (let r=0; r<rows; r++) for (let c=0; c<cols; c++) {
      const x0 = gridLinesX[c], y0 = gridLinesY[r];
      const cw = gridLinesX[c+1] - x0, ch = gridLinesY[r+1] - y0;
      const px = (automatic ? Math.min(cw, ch) : cw) * pad / 100;
      const py = (automatic ? Math.min(cw, ch) : ch) * pad / 100;
      const sw = cw - px*2, sh = ch - py*2;
      const cv = document.createElement('canvas');
      cv.width = sw; cv.height = sh;
      if (!cv.width || !cv.height) continue;
      cv.getContext('2d').drawImage(img, x0+px, y0+py, sw, sh, 0, 0, cv.width, cv.height);
      if (!automatic || !isUiIcon(cv)) cards.push(cv.toDataURL('image/webp', 0.9));
    }
    lastRemoval.delete(screenshot);
    Object.assign(screenshot, { grid, pad, cards, selectedCards: new Set() });
  }

  function autoSlice(screenshot) {
    sliceByGrid(screenshot, detectGrid(screenshot.img, screenshot.crop), 8, true);
  }

  // UI icons (camiseta+, shuffle) are flat shapes with very few distinct
  // colours. Real skins are photographic and have hundreds. Quantise RGB to
  // 32-step buckets and count the unique ones.
  function isUiIcon(canvas) {
    const ctx = canvas.getContext('2d');
    const { data } = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const seen = new Set();
    for (let i = 0; i < data.length; i += 16) {
      const key = ((data[i] >> 5) << 10) | ((data[i+1] >> 5) << 5) | (data[i+2] >> 5);
      seen.add(key);
      if (seen.size > 60) return false;
    }
    return true;
  }

  function drawOverlay() {
    const screenshot = selected();
    if (!screenshot) return;
    const { img, grid, crop } = screenshot;
    const { bbox, gridLinesX: linesX, gridLinesY: linesY } = grid;
    const w = img.clientWidth, h = img.clientHeight;
    overlay.width = w; overlay.height = h;
    const ctx = overlay.getContext('2d');
    const sx = w / img.naturalWidth, sy = h / img.naturalHeight;
    const area = drag ? cropRect(drag.start, drag.end) : crop;
    if (area) {
      const x = area.x*sx, y = area.y*sy, w = area.w*sx, h = area.h*sy;
      ctx.fillStyle = 'rgba(0,0,0,.45)';
      ctx.fillRect(0, 0, overlay.width, overlay.height);
      ctx.clearRect(x, y, w, h);
      ctx.strokeStyle = '#ffd84d';
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, w, h);
    }
    if (cropping) return;
    ctx.strokeStyle = 'rgba(91,141,255,.9)'; ctx.lineWidth = 2;
    ctx.strokeRect(bbox.x*sx, bbox.y*sy, bbox.w*sx, bbox.h*sy);
    ctx.strokeStyle = 'rgba(80,220,120,.8)'; ctx.lineWidth = 1;
    for (const x of linesX) { ctx.beginPath(); ctx.moveTo(x*sx, bbox.y*sy); ctx.lineTo(x*sx, (bbox.y+bbox.h)*sy); ctx.stroke(); }
    for (const y of linesY) { ctx.beginPath(); ctx.moveTo(bbox.x*sx, y*sy); ctx.lineTo((bbox.x+bbox.w)*sx, y*sy); ctx.stroke(); }
  }

  document.getElementById('refatiar').onclick = () => {
    const screenshot = selected();
    if (!screenshot || !colsInput.value || !rowsInput.value ||
        !colsInput.reportValidity() || !rowsInput.reportValidity() || !padInput.reportValidity()) return;
    const cols = +colsInput.value, rows = +rowsInput.value;
    const bbox = screenshot.crop || imageBounds(screenshot.img);
    const gridLinesX = Array.from({ length: cols + 1 }, (_, i) => bbox.x + i * bbox.w / cols);
    const gridLinesY = Array.from({ length: rows + 1 }, (_, i) => bbox.y + i * bbox.h / rows);
    sliceByGrid(screenshot, { cols, rows, bbox, gridLinesX, gridLinesY }, +padInput.value, false);
    showPrint();
    renderPool();
  };
  document.getElementById('autobtn').onclick = () => {
    if (!selected()) return;
    autoSlice(selected());
    showPrint();
    renderPool();
  };

  save.onclick = () => {
    const cards = screenshots.flatMap(screenshot => screenshot.cards);
    if (pendingBatches || !cards.length) return;
    const s = targetSet ? DB.getSet(targetSet.id) : {
      id: uid(), name: setName.value.trim() || 'Set sem nome', createdAt: Date.now(), cards: [],
      tags: parseSetTags(document.getElementById('newSetTags').value),
    };
    if (!s) {
      showStatus('Set não encontrado.');
      return;
    }
    s.cards = s.cards.concat(cards);
    const template = tierTemplate && templates.find(t => t.id === tierTemplate.value);
    if (template) s.tiers = template.tiers.map((tier, i) => ({ ...tier, id: 't' + i }));
    try {
      DB.upsertSet(s);
    } catch (error) {
      if (error.name !== 'QuotaExceededError') throw error;
      showStatus('Armazenamento cheio. Remova algum print ou libere espaço e tente novamente.');
      return;
    }
    location.hash = '#/set/' + s.id;
  };
}

// ---------- grid detector (gap-colour mask + plateau runs) ----------
// Idea: the page background between tiles is a single uniform colour. Mask
// pixels that match that colour, invert, project per axis. The signal is
// almost binary: 1 over tile rows/cols, 0 over gaps. Each contiguous
// above-threshold run is a tile; the gap between consecutive runs is a grid
// line. Period comes out of the medians.
function imageBounds(img) {
  return { x: 0, y: 0, w: img.naturalWidth, h: img.naturalHeight };
}

function detectGrid(img, area = imageBounds(img)) {
  const maxW = 900;
  const scale = Math.min(1, maxW / area.w);
  const w = Math.max(1, Math.round(area.w * scale));
  const h = Math.max(1, Math.round(area.h * scale));
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  ctx.drawImage(img, area.x, area.y, area.w, area.h, 0, 0, w, h);
  const data = ctx.getImageData(0, 0, w, h).data;

  // --- find gap colour: mode of a 3-pixel border ring, bucketised to 8 ---
  const buckets = new Map();
  const add = (r, g, b) => {
    const key = ((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3);
    buckets.set(key, (buckets.get(key) || 0) + 1);
  };
  const addRow = (y) => { for (let x = 0; x < w; x++) { const i = (y*w+x)*4; add(data[i], data[i+1], data[i+2]); } };
  const addCol = (x) => { for (let y = 0; y < h; y++) { const i = (y*w+x)*4; add(data[i], data[i+1], data[i+2]); } };
  for (let i = 0; i < Math.min(3, h); i++) { addRow(i); addRow(h-1-i); }
  for (let i = 0; i < Math.min(3, w); i++) { addCol(i); addCol(w-1-i); }
  let bestKey = 0, bestCnt = 0;
  for (const [k, c] of buckets) { if (c > bestCnt) { bestCnt = c; bestKey = k; } }
  const gR = ((bestKey >> 10) & 31) << 3;
  const gG = ((bestKey >> 5)  & 31) << 3;
  const gB = ( bestKey        & 31) << 3;

  // --- build tile-mask (1 where pixel is NOT gap colour), project ---
  const px = new Float32Array(w), py = new Float32Array(h);
  const TH2 = 70 * 70;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y*w + x) * 4;
      const dr = data[i] - gR, dg = data[i+1] - gG, db = data[i+2] - gB;
      const isTile = (dr*dr + dg*dg + db*db) >= TH2 ? 1 : 0;
      px[x] += isTile; py[y] += isTile;
    }
  }
  for (let x = 0; x < w; x++) px[x] /= h;
  for (let y = 0; y < h; y++) py[y] /= w;

  const linesX = findGridLines(px, w).map(v => area.x + v * area.w / w);
  const linesY = findGridLines(py, h).map(v => area.y + v * area.h / h);
  const bbox = {
    x: linesX[0], y: linesY[0],
    w: linesX[linesX.length-1] - linesX[0],
    h: linesY[linesY.length-1] - linesY[0],
  };
  return { bbox, cols: linesX.length - 1, rows: linesY.length - 1, gridLinesX: linesX, gridLinesY: linesY };
}

// Threshold the smoothed projection at 50% of its range, collect contiguous
// above-threshold runs. Each run is a tile. Grid lines are the midpoints
// between consecutive runs, plus outer edges extrapolated from the median
// period.
function findGridLines(proj, n) {
  const k = Math.max(2, Math.round(n * 0.004));
  const s = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    let sum = 0, c = 0;
    for (let j = Math.max(0, i-k); j <= Math.min(n-1, i+k); j++) { sum += proj[j]; c++; }
    s[i] = sum / c;
  }
  let mn = Infinity, mx = -Infinity;
  for (let i = 0; i < n; i++) { if (s[i] < mn) mn = s[i]; if (s[i] > mx) mx = s[i]; }
  const thr = mn + (mx - mn) * 0.5;

  const runs = [];
  let start = -1;
  for (let i = 0; i < n; i++) {
    if (s[i] >= thr) { if (start < 0) start = i; }
    else if (start >= 0) { runs.push([start, i-1]); start = -1; }
  }
  if (start >= 0) runs.push([start, n-1]);
  if (!runs.length) return [0, n-1];

  // drop very short runs (noise), compared to the median width
  const widths = runs.map(r => r[1] - r[0] + 1).sort((a,b) => a-b);
  const typical = widths[widths.length >> 1];
  const kept = runs.filter(r => (r[1] - r[0] + 1) >= typical * 0.4);
  if (!kept.length) return [0, n-1];

  const centers = kept.map(r => (r[0] + r[1]) / 2);
  const spans = [];
  for (let i = 1; i < centers.length; i++) spans.push(centers[i] - centers[i-1]);
  spans.sort((a,b) => a-b);
  const period = spans.length ? spans[spans.length >> 1] : typical;

  const lines = [Math.max(0, centers[0] - period/2)];
  for (let i = 1; i < centers.length; i++) lines.push((centers[i-1] + centers[i]) / 2);
  lines.push(Math.min(n-1, centers[centers.length-1] + period/2));
  return lines;
}

function initEditor(set) {
  const pool = document.getElementById('pool');

  const destination = document.getElementById('moveDestination');
  const selectedCards = new Set();
  const templateDetails = document.getElementById('templateDetails');
  const templateName = document.getElementById('templateName');
  const templateError = document.getElementById('templateError');
  const saveTemplate = document.getElementById('saveTierTemplate');
  const templateMenu = document.getElementById('tierTemplateMenu');
  const templateMenuToggle = templateMenu.querySelector('summary');
  const loadTemplate = document.getElementById('loadTierTemplate');
  const loadDialog = document.getElementById('loadTemplateDialog');
  const savedTemplates = document.getElementById('savedTierTemplates');
  const loadHint = document.getElementById('loadTemplateHint');
  const loadError = document.getElementById('loadTemplateError');
  const applyTemplate = document.getElementById('applyTierTemplate');
  const editor = pool.closest('.editor');

  // Per-set tier list. Default to TIERS; older sets stored layout keyed by
  // tier letter, so adopt the letter as the id for back-compat.
  if (!set.tiers) set.tiers = TIERS.map(t => ({ id: t.l, l: t.l, c: t.c }));
  const layout = set.layout || null;
  const srcMap = new Map();
  set.cards.forEach((src, i) => srcMap.set('c'+i, src));

  for (const t of set.tiers) addTierRow(t);
  wireDrop(pool);

  // Extended label mode is the default.
  const updateWideMode = () => { tiersEl.classList.add('wide'); fitTierFont(); };
  window.addEventListener('resize', fitTierFont);
  tiersEl.addEventListener('input', () => {
    updateWideMode();
    // sync label edits into set.tiers
    for (const row of tiersEl.querySelectorAll('.tier')) {
      const t = set.tiers.find(t => t.id === row.dataset.tier);
      if (t) t.l = row.querySelector('.lbl').textContent;
    }
    DB.upsertSet(set);
    updateDestinations();
  });
  updateWideMode();

  const placed = new Set();
  if (layout) {
    for (const t of set.tiers) {
      const dz = tiersEl.querySelector(`[data-tier="${t.id}"] .drop`);
      for (const id of (layout[t.id] || [])) {
        const src = srcMap.get(id); if (!src) continue;
        dz.appendChild(makeCell(id, src));
        placed.add(id);
      }
    }
  }
  for (const [id, src] of srcMap) {
    if (!placed.has(id)) pool.appendChild(makeCell(id, src));
  }
  updateDestinations();

  function updateSelection() {
    const count = selectedCards.size;
    moveCards.disabled = count === 0;
    moveCards.textContent = count ? `Mover selecionados (${count})` : 'Mover selecionados';
  }

  function updateDestinations() {
    const previous = destination.value;
    destination.replaceChildren(new Option('Pool', ''));
    for (const tier of set.tiers) destination.add(new Option(tier.l, tier.id));
    if (set.tiers.some(tier => tier.id === previous)) destination.value = previous;
    saveTemplate.disabled = set.tiers.length === 0;
  }

  moveCards.onclick = () => {
    const target = destination.value
      ? tiersEl.querySelector(`[data-tier="${destination.value}"] .drop`) : pool;
    for (const card of editor.querySelectorAll('.cell[aria-pressed="true"]')) {
      if (card.parentElement !== target) target.appendChild(card);
      card.setAttribute('aria-pressed', 'false');
    }
    selectedCards.clear();
    saveLayout();
    updateSelection();
    destination.focus();
  };

  saveTemplate.onclick = () => {
    templateMenu.open = false;
    templateMenuToggle.focus();
    templateName.value = set.name;
    templateError.hidden = true;
    templateDetails.showModal();
  };
  templateDetails.querySelector('form').onsubmit = event => {
    if (event.submitter?.value === 'cancel') return;
    event.preventDefault();
    const name = templateName.value.trim();
    const templates = DB.tierTemplates();
    if (!name || templates.some(template => template.name === name)) {
      templateError.textContent = name ? 'Já existe um modelo com esse nome.' : 'Digite um nome para o modelo.';
      templateError.hidden = false;
      return;
    }
    const tiers = set.tiers.map(({ l, c }) => ({ l, c }));
    try {
      DB.saveTierTemplates([...templates, { id: uid(), name, tiers }]);
    } catch (error) {
      if (error.name !== 'QuotaExceededError') throw error;
      templateError.textContent = 'Armazenamento cheio. Libere espaço para salvar o modelo.';
      templateError.hidden = false;
      return;
    }
    templateDetails.close();
  };

  let templates = [];
  const chosenTemplate = () => templates.find(template => template.id === savedTemplates.value);

  function describeTemplate() {
    const template = chosenTemplate();
    applyTemplate.disabled = !template;
    if (!template) {
      loadHint.textContent = 'Salve um modelo para poder carregá-lo aqui.';
      return;
    }
    const returning = set.tiers.slice(template.tiers.length)
      .reduce((count, tier) => count + (set.layout?.[tier.id]?.length || 0), 0);
    loadHint.textContent = 'Os cards permanecem na mesma linha do ranking.' +
      (returning ? ` Cards em linhas sem correspondência voltam para o pool (${returning}).` : '');
  }

  loadTemplate.onclick = () => {
    templateMenu.open = false;
    templateMenuToggle.focus();
    templates = DB.tierTemplates();
    savedTemplates.replaceChildren(...templates.map(template => new Option(template.name, template.id)));
    savedTemplates.disabled = !templates.length;
    loadError.hidden = true;
    describeTemplate();
    loadDialog.showModal();
  };
  savedTemplates.onchange = describeTemplate;
  loadDialog.querySelector('form').onsubmit = event => {
    if (event.submitter?.value === 'cancel') return;
    event.preventDefault();
    const template = chosenTemplate();
    if (!template) return;
    const tiers = template.tiers.map((tier, i) => ({ ...tier, id: set.tiers[i]?.id || uid() }));
    const layout = Object.fromEntries(tiers.map(tier => [tier.id, set.layout?.[tier.id] || []]));
    try {
      DB.upsertSet({ ...set, tiers, layout });
    } catch (error) {
      if (error.name !== 'QuotaExceededError') throw error;
      loadError.textContent = 'Armazenamento cheio. Libere espaço para aplicar o modelo.';
      loadError.hidden = false;
      return;
    }
    loadDialog.close();
    render();
    document.querySelector('#tierTemplateMenu summary').focus();
  };
  templateMenu.onkeydown = event => {
    if (event.key !== 'Escape' || !templateMenu.open) return;
    event.preventDefault();
    templateMenu.open = false;
    templateMenuToggle.focus();
  };

  document.getElementById('addTier').onclick = () => {
    const palette = ['#5b8dff','#ff6ec7','#9dcf4d','#c79cff','#ffb24d','#4dd0c7','#ff8a8a','#a0a0a0'];
    const t = { id: uid(), l: 'Novo', c: palette[set.tiers.length % palette.length] };
    set.tiers.push(t);
    addTierRow(t);
    DB.upsertSet(set);
    updateWideMode();
    updateDestinations();
  };

  function addTierRow(t) {
    const row = document.createElement('div');
    row.className = 'tier';
    row.dataset.tier = t.id;
    row.innerHTML = `
      <div class="lblWrap" style="background:${t.c}">
        <div class="lbl" contenteditable spellcheck="false"></div>
        <div class="tools">
          <button title="Cor" data-color>●</button>
          <button title="Mover para cima" data-up>↑</button>
          <button title="Mover para baixo" data-down>↓</button>
          <button title="Excluir tier" data-del>×</button>
        </div>
        <div class="palette">${PALETTE.map(c => `<span data-c="${c}" style="background:${c}"></span>`).join('')}</div>
      </div>
      <div class="drop"></div>`;
    row.querySelector('.lbl').textContent = t.l;
    tiersEl.appendChild(row);
    wireDrop(row.querySelector('.drop'));
    const wrap = row.querySelector('.lblWrap');
    row.querySelector('[data-color]').onclick = e => {
      e.stopPropagation();
      // close any other open palette
      for (const w of tiersEl.querySelectorAll('.lblWrap.open')) if (w !== wrap) w.classList.remove('open');
      wrap.classList.toggle('open');
    };
    row.querySelector('.palette').onclick = e => {
      const c = e.target.dataset.c; if (!c) return;
      t.c = c;
      wrap.style.background = c;
      wrap.classList.remove('open');
      DB.upsertSet(set);
    };
    row.querySelector('[data-up]').onclick = () => moveTier(t.id, -1);
    row.querySelector('[data-down]').onclick = () => moveTier(t.id, +1);
    row.querySelector('[data-del]').onclick = () => {
      if (!confirm(`Excluir tier "${t.l}"? As skins voltam pro pool.`)) return;
      for (const c of row.querySelectorAll('.cell')) pool.appendChild(c);
      row.remove();
      set.tiers = set.tiers.filter(x => x.id !== t.id);
      saveLayout();
      updateWideMode();
      updateDestinations();
    };
  }

  function wireDrop(el) {
    el.ondragover = e => { e.preventDefault(); el.classList.add('over'); };
    el.ondragleave = () => el.classList.remove('over');
    el.ondrop = e => {
      e.preventDefault(); el.classList.remove('over');
      const id = e.dataTransfer.getData('text/plain');
      const c = document.getElementById('cell-'+id);
      if (!c) return;
      const after = insertionTarget(el, c, e.clientX, e.clientY);
      if (after == null) el.appendChild(c);
      else el.insertBefore(c, after);
      saveLayout();
    };
  }

  // Which existing cell should the dragged card land before? Returns the
  // closest cell on the SAME row (by y) whose horizontal center is to the
  // right of the cursor; null means "append at end".
  function insertionTarget(container, dragged, x, y) {
    const cells = [...container.querySelectorAll('.cell')].filter(c => c !== dragged);
    if (!cells.length) return null;
    // Pick the row (set of cells sharing a y band) nearest to the cursor.
    const rowH = cells[0].offsetHeight;
    const sameRow = cells.filter(c => {
      const r = c.getBoundingClientRect();
      return y >= r.top - rowH / 2 && y <= r.bottom + rowH / 2;
    });
    const candidates = sameRow.length ? sameRow : cells;
    for (const c of candidates) {
      const r = c.getBoundingClientRect();
      if (x < r.left + r.width / 2) return c;
    }
    return null;
  }
  function makeCell(id, src) {
    const d = document.createElement('button');
    d.type = 'button';
    d.className = 'cell';
    d.id = 'cell-'+id;
    d.draggable = true;
    d.style.backgroundImage = `url(${src})`;
    d.setAttribute('aria-pressed', 'false');
    d.setAttribute('aria-label', 'Card ' + (Number(id.slice(1)) + 1));
    d.onclick = () => {
      const pressed = !selectedCards.delete(d);
      if (pressed) selectedCards.add(d);
      d.setAttribute('aria-pressed', pressed);
      updateSelection();
    };
    d.ondragstart = e => { e.dataTransfer.setData('text/plain', id); d.classList.add('drag'); };
    d.ondragend = () => d.classList.remove('drag');
    return d;
  }
  function moveTier(id, dir) {
    const i = set.tiers.findIndex(x => x.id === id);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= set.tiers.length) return;
    [set.tiers[i], set.tiers[j]] = [set.tiers[j], set.tiers[i]];
    const rows = [...tiersEl.querySelectorAll('.tier')];
    if (dir < 0) tiersEl.insertBefore(rows[i], rows[j]);
    else tiersEl.insertBefore(rows[j], rows[i]);
    DB.upsertSet(set);
    updateDestinations();
  }

  function saveLayout() {
    const l = {};
    for (const row of tiersEl.querySelectorAll('.tier')) {
      l[row.dataset.tier] = [...row.querySelectorAll('.cell')].map(c => c.id.replace('cell-',''));
    }
    set.layout = l;
    DB.upsertSet(set);
  }

  document.getElementById('exportBtn').onclick = async () => {
    const rows = [...tiersEl.querySelectorAll('.tier')];
    const cellW = 72, cellH = 96, pad = 10, radius = 14;
    const wide = true;
    const labelW = 128;
    // Pick one font size that fits every label into labelW.
    const availText = labelW - pad * 2;
    const MIN = 12, MAX = 32;
    let labelFont = MAX;
    for (const r of rows) {
      const txt = r.querySelector('.lbl').textContent.trim() || ' ';
      const w = measureAtPx(txt, MAX);
      if (w > availText) labelFont = Math.min(labelFont, Math.max(MIN, MAX * availText / w));
    }
    const maxCells = Math.max(1, ...rows.map(r => r.querySelectorAll('.cell').length));
    const width = labelW + pad + maxCells*(cellW+pad) + pad;
    const height = pad + rows.length*(cellH+pad);
    const cv = document.createElement('canvas');
    cv.width = width; cv.height = height;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#141822'; ctx.fillRect(0,0,width,height);
    for (let i=0; i<rows.length; i++) {
      const y = pad + i*(cellH+pad);
      const lbl = rows[i].querySelector('.lbl');
      const wrap = rows[i].querySelector('.lblWrap');
      ctx.fillStyle = (wrap && wrap.style.background) || lbl.style.background || lbl.style.backgroundColor;
      roundRect(ctx, pad, y, labelW-pad, cellH, 8); ctx.fill();
      const txt = lbl.textContent;
      ctx.fillStyle = '#111';
      ctx.font = `bold ${labelFont.toFixed(1)}px system-ui`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      wrapText(ctx, txt, pad + (labelW-pad)/2, y + cellH/2, labelW - pad*2, labelFont * 1.1);
      const cells = [...rows[i].querySelectorAll('.cell')];
      for (let j=0; j<cells.length; j++) {
        const src = cells[j].style.backgroundImage.slice(5,-2);
        const im = new Image();
        await new Promise(r => { im.onload = r; im.src = src; });
        const cx = labelW + pad + j*(cellW+pad);
        ctx.save();
        roundRect(ctx, cx, y, cellW, cellH, radius); ctx.clip();
        ctx.drawImage(im, cx, y, cellW, cellH);
        ctx.restore();
      }
    }
    const png = cv.toDataURL('image/png');
    const exp = { id: uid(), setId: set.id, name: set.name + ' tierlist', createdAt: Date.now(), png };
    const all = DB.exports(); all.unshift(exp); DB.saveExports(all);
    location.hash = '#/exports';
  };

  document.getElementById('sheetBtn').onclick = async () => {
    // Contact sheet of every card in the set, laid out as a grid.
    const n = set.cards.length;
    const cols = Math.min(8, Math.ceil(Math.sqrt(n)));
    const rows = Math.ceil(n / cols);
    const tileW = 96, tileH = 128, pad = 10, radius = 16;
    const w = pad + cols*(tileW+pad);
    const h = pad + rows*(tileH+pad);
    const cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#141822'; ctx.fillRect(0,0,w,h);
    for (let i = 0; i < n; i++) {
      const col = i % cols, row = Math.floor(i / cols);
      const x = pad + col*(tileW+pad), y = pad + row*(tileH+pad);
      const im = new Image();
      await new Promise(r => { im.onload = r; im.src = set.cards[i]; });
      ctx.save();
      roundRect(ctx, x, y, tileW, tileH, radius); ctx.clip();
      ctx.drawImage(im, x, y, tileW, tileH);
      ctx.restore();
    }
    const a = document.createElement('a');
    a.download = `${set.name.replace(/\s+/g, '_')}_cards.png`;
    a.href = cv.toDataURL('image/png');
    a.click();
  };
}

// Shared measurement canvas for text sizing.
const _mctx = document.createElement('canvas').getContext('2d');
function measureAtPx(text, px, weight = 800) {
  _mctx.font = `${weight} ${px}px system-ui, -apple-system, Segoe UI, Roboto`;
  return _mctx.measureText(text).width;
}

// Scan the current tier labels, find the biggest font size (within [MIN,MAX])
// at which the widest label still fits in the available width, and apply it
// to all of them via a CSS var.
function fitTierFont() {
  const tiers = document.getElementById('tiers');
  if (!tiers) return;
  const labels = [...tiers.querySelectorAll('.lbl')];
  if (!labels.length) return;
  const avail = (labels[0].clientWidth || 82) - 8;   // minus internal padding
  const MIN = 10, MAX = 22;
  let size = MAX;
  for (const l of labels) {
    const t = l.textContent.trim() || ' ';
    const w = measureAtPx(t, MAX);
    if (w > avail) size = Math.min(size, Math.max(MIN, MAX * avail / w));
  }
  tiers.style.setProperty('--tier-font', size.toFixed(1) + 'px');
}

function wrapText(ctx, text, cx, cy, maxW, lineH) {
  const words = text.split(/\s+/);
  const lines = []; let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = w; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  const start = cy - ((lines.length - 1) * lineH) / 2;
  for (let i = 0; i < lines.length; i++) ctx.fillText(lines[i], cx, start + i * lineH);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

render();
</script>
</body>
